[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debugbuddy-python"
version = "1.1.0"
description = "A beginner-friendly Python debugging assistant, code explainer, and error analysis tool."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "DebugBuddy Contributors"}]
keywords = [
    "python",
    "debugging",
    "errors",
    "traceback",
    "code-explainer",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
debugbuddy = "debugbuddy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
